name: macOS build

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

jobs:
    test-macOS:
        runs-on: ${{ matrix.os }}
        name: ${{ matrix.os }} (${{ matrix.python-version }})

        strategy:
            fail-fast: false
            matrix:
                os: ["macOS-latest"]
                python-version: ["3.11"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install native GDAL
              run: |
                  brew update
                  brew install gdal
                  gdal-config --version

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install GDAL Python bindings (matching system version)
              run: |
                  python -m pip install --upgrade pip
                  pip install --no-cache-dir Cython numpy setuptools wheel
                  pip install --no-build-isolation "GDAL==$(gdal-config --version)"

            - name: Install dependencies
              run: |
                  pip install -r requirements.txt
                  pip install .

            - name: PKG-TEST
              run: |
                  python -m unittest discover tests/